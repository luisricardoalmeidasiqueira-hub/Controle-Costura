<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de encomendas</title>
<style>
:root{
  --bg:#f2eadb;--card:#fffdf8;--ink:#25221d;--muted:#6d665b;
  --border:#d9ccb4;--dark:#2d5752;--dark2:#1f4944;
  --red:#e53935;--redbg:#ffe7e5;
  --yellow:#f5b91d;--yellowbg:#fff1c9;
  --green:#25a447;--greenbg:#dcf6e2;
  --green-dark:#24574f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
body{-webkit-font-smoothing:antialiased}
.wrap{width:min(100%,1000px);margin:auto;padding:18px 18px 45px}
header{text-align:center;padding:4px 0 18px}
header h1{margin:0;font-family:Georgia,serif;font-size:clamp(28px,6vw,46px);line-height:1.05;color:#153c38}
header p{margin:8px 0 0;color:#38615c;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:center;box-shadow:0 2px 8px #00000008}
.stat .n{font:bold 30px Georgia,serif;color:var(--dark)}
.stat .l{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000008}
.card h2{font:bold 25px Georgia,serif;margin:0 0 18px}
.field{margin-bottom:13px}.field label{display:block;font-size:14px;color:#5f584e;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:11px;background:#f4ecdc;color:var(--ink);padding:13px 14px;font:16px Arial,sans-serif;min-height:48px}
textarea{min-height:66px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #7da39e;outline-offset:1px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#campo-faltante{display:none}
button{font:600 15px Arial,sans-serif;cursor:pointer}
.principal{width:100%;border:0;border-radius:11px;padding:14px;background:var(--dark);color:white;font-size:17px}
.principal:active,.avancar:active{transform:scale(.99)}
.filtros{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border);border-radius:24px;background:var(--card);padding:11px 18px;color:var(--muted);font-size:14px;white-space:nowrap}
.chip.ativo{background:var(--dark);border-color:var(--dark);color:#fff}
.chip[data-filtro="pendente"].ativo{background:var(--red);border-color:var(--red)}
.chip[data-filtro="andamento"].ativo{background:var(--yellow);border-color:var(--yellow);color:#493600}
.chip[data-filtro="pronto"].ativo{background:var(--green);border-color:var(--green)}
.chip[data-filtro="entregue"].ativo{background:var(--green-dark);border-color:var(--green-dark)}
.lista-titulo{font:bold 22px Georgia,serif;margin:4px 0 12px}
.pedido{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px;position:relative;overflow:hidden}
.pedido::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--dark)}
.pedido.status-pendente::before{background:var(--red)}
.pedido.status-andamento::before{background:var(--yellow)}
.pedido.status-pronto::before{background:var(--green)}
.pedido.status-entregue::before{background:var(--green-dark)}
.pedido-grid{display:grid;grid-template-columns:minmax(0,1fr) 170px 205px;gap:15px;align-items:center;padding-left:7px}
.cliente{font:bold 21px Georgia,serif}.peca{color:var(--muted);margin-top:4px}
.meta{color:var(--muted);font-size:13px;margin-top:13px;line-height:1.5}
.financeiro{font-size:14px;line-height:1.55}.financeiro strong{color:var(--ink)}
.falta{color:var(--red);font-weight:700}
.badge{display:inline-block;padding:8px 15px;border-radius:22px;font-weight:bold;margin-bottom:8px;white-space:nowrap}
.b-pendente{background:var(--red);color:#fff}.b-andamento{background:var(--yellow);color:#493600}
.b-pronto{background:var(--green);color:#fff}.b-entregue{background:var(--green-dark);color:#fff}
.acoes{display:flex;flex-direction:column;gap:8px}
.avancar{border:0;border-radius:10px;padding:12px;background:var(--dark);color:#fff;font-size:15px}
.avancar.pendente{background:var(--yellow);color:#493600}.avancar.andamento{background:var(--green);color:#fff}.avancar.pronto{background:var(--green-dark);color:#fff}.avancar.entregue{display:none}
.secundarias{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editar,.excluir{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:9px;color:var(--ink)}
.excluir{color:#c62828}
.obs{margin-top:9px;color:var(--muted);font-style:italic;font-size:13px}
.vazio{text-align:center;padding:35px 10px;color:var(--muted)}
footer{border-top:1px dashed var(--border);margin-top:28px;padding-top:18px;text-align:center;color:var(--muted);font-family:Georgia,serif;font-style:italic}
@media(max-width:720px){
  .wrap{padding:14px 12px 40px}
  .stats{gap:8px}.stat{padding:11px 6px}.stat .n{font-size:25px}
  .row3{grid-template-columns:1fr 1fr}.row3 .field:last-child{grid-column:1/-1}
  .pedido-grid{grid-template-columns:1fr}
  .acoes{display:grid;grid-template-columns:1fr}
  .secundarias{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  header h1{font-size:30px} header p{font-size:10px;letter-spacing:1.2px}
  .row2,.row3{grid-template-columns:1fr}
  .row3 .field:last-child{grid-column:auto}
  .card{padding:16px}
  .pedido-grid{gap:10px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧵 Controle de encomendas</h1>
  <p>Pedidos de costura, do primeiro contato à entrega</p>
</header>

<div class="stats">
  <div class="stat"><div class="n" id="stat-total">0</div><div class="l">no total</div></div>
  <div class="stat"><div class="n" id="stat-abertos">0</div><div class="l">em aberto</div></div>
  <div class="stat"><div class="n" id="stat-receber">R$ 0,00</div><div class="l">a receber</div></div>
</div>

<div class="card">
  <h2>➕ Nova encomenda</h2>
  <div class="row2">
    <div class="field"><label>Cliente</label><input id="f-cliente" placeholder="Nome da cliente"></div>
    <div class="field"><label>Peça ou serviço</label><input id="f-peca" placeholder="Vestido de festa, bainha de calça..."></div>
  </div>
  <div class="row3">
    <div class="field"><label>Data do pedido</label><input id="f-pedido" type="date"></div>
    <div class="field"><label>Entrega prevista</label><input id="f-entrega" type="date"></div>
    <div class="field"><label>Valor combinado (R$)</label><input id="f-valor" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></div>
  </div>
  <div class="row3">
    <div class="field"><label>Status</label>
      <select id="f-status">
        <option value="pendente">Pendente</option><option value="andamento">Em andamento</option>
        <option value="pronto">Pronto</option><option value="entregue">Entregue</option>
      </select>
    </div>
    <div class="field"><label>Pagamento</label>
      <select id="f-pagamento">
        <option value="nao_pago">Não pago</option><option value="parcial">Parcial</option><option value="total">Pago total</option>
      </select>
    </div>
    <div class="field" id="campo-faltante"><label>Valor faltante (R$)</label><input id="f-faltante" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></div>
  </div>
  <div class="field"><label>Observações</label><textarea id="f-obs" placeholder="Medidas, tecido, ajustes combinados..."></textarea></div>
  <button class="principal" id="btn-salvar">💾 Salvar encomenda</button>
</div>

<div class="filtros">
  <button class="chip ativo" data-filtro="todos">Todos</button>
  <button class="chip" data-filtro="pendente">Pendentes</button>
  <button class="chip" data-filtro="andamento">Em andamento</button>
  <button class="chip" data-filtro="pronto">Prontos</button>
  <button class="chip" data-filtro="entregue">Entregues</button>
</div>

<div class="lista-titulo">☷ Lista de encomendas</div>
<div id="lista"></div>

<footer>♡ Organização hoje, clientes sempre!<br><small>Criado por Luís Ricardo</small></footer>
</div>

<script>
const CHAVE='pedidos-costura';
const LABEL={pendente:'Pendente',andamento:'Em andamento',pronto:'Pronto',entregue:'Entregue'};
let pedidos=[];
let filtro='todos';

const $=id=>document.getElementById(id);
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function dataBR(v){if(!v)return '—';const [a,m,d]=v.split('-');return `${d}/${m}/${a}`;}
function hoje(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function escapar(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML;}

function carregar(){
  try{pedidos=JSON.parse(localStorage.getItem(CHAVE)||'[]');if(!Array.isArray(pedidos))pedidos=[]}
  catch(e){pedidos=[]}
  render();
}
function persistir(){try{localStorage.setItem(CHAVE,JSON.stringify(pedidos));return true}catch(e){alert('Não foi possível salvar neste navegador.');return false}}

function valorFaltante(p){
  if(p.pagamento==='total')return 0;
  if(p.pagamento==='parcial')return Number(p.faltante)||0;
  return Number(p.valor)||0;
}

function render(){
  $('stat-total').textContent=pedidos.length;
  $('stat-abertos').textContent=pedidos.filter(p=>p.status!=='entregue').length;
  $('stat-receber').textContent=moeda(pedidos.reduce((s,p)=>s+valorFaltante(p),0));

  const arr=filtro==='todos'?pedidos:pedidos.filter(p=>p.status===filtro);
  if(!arr.length){$('lista').innerHTML='<div class="vazio">Nenhuma encomenda por aqui.<br>Cadastre a primeira encomenda acima.</div>';return}

  $('lista').innerHTML=arr.map(p=>{
    const prox={pendente:'andamento',andamento:'pronto',pronto:'entregue',entregue:'entregue'}[p.status];
    const textoProx={pendente:'▶ Avançar para Em andamento',andamento:'▶ Avançar para Pronto',pronto:'▶ Avançar para Entregue',entregue:''}[p.status];
    const pag=p.pagamento==='total'
      ? 'Pagamento: <strong>Pago total</strong>'
      : p.pagamento==='parcial'
        ? 'Pagamento: <strong>Parcial</strong><br><span class="falta">Faltam '+moeda(p.faltante)+'</span>'
        : 'Pagamento: <strong>Não pago</strong><br><span class="falta">Falta '+moeda(p.valor)+'</span>';
    return `<div class="pedido status-${p.status}">
      <div class="pedido-grid">
        <div>
          <div class="cliente">${escapar(p.cliente)}</div>
          <div class="peca">${escapar(p.peca)}</div>
          <div class="meta">📅 Pedido: ${dataBR(p.dataPedido)}<br>📅 Entrega: ${dataBR(p.dataEntrega)}</div>
          ${p.obs?`<div class="obs">${escapar(p.obs)}</div>`:''}
        </div>
        <div>
          <div class="badge b-${p.status}">${LABEL[p.status]}</div>
          <div class="financeiro">Valor: <strong>${moeda(p.valor)}</strong><br>${pag}</div>
        </div>
        <div class="acoes">
          <button class="avancar ${p.status}" data-avancar="${p.id}" ${p.status==='entregue'?'style="display:none"':''}>${textoProx}</button>
          <div class="secundarias">
            <button class="editar" data-editar="${p.id}">✎ Editar</button>
            <button class="excluir" data-excluir="${p.id}">🗑 Excluir</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-avancar]').forEach(b=>b.onclick=()=>{
    const p=pedidos.find(x=>x.id===b.dataset.avancar);
    if(!p)return;
    const prox={pendente:'andamento',andamento:'pronto',pronto:'entregue'}[p.status];
    if(prox){p.status=prox;persistir();render()}
  });
  document.querySelectorAll('[data-excluir]').forEach(b=>b.onclick=()=>{
    if(confirm('Excluir esta encomenda?')){pedidos=pedidos.filter(x=>x.id!==b.dataset.excluir);persistir();render()}
  });
  document.querySelectorAll('[data-editar]').forEach(b=>b.onclick=()=>editar(b.dataset.editar));
}

function salvar(){
  const cliente=$('f-cliente').value.trim(), peca=$('f-peca').value.trim();
  if(!cliente||!peca){alert('Preencha Cliente e Peça ou serviço.');return}
  const pagamento=$('f-pagamento').value;
  const valor=Number($('f-valor').value)||0;
  const faltante=pagamento==='total'?0:pagamento==='parcial'?(Number($('f-faltante').value)||0):valor;
  if(pagamento==='parcial' && faltante<=0){alert('Informe o valor faltante.');$('f-faltante').focus();return}
  const p={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2),
    cliente,peca,dataPedido:$('f-pedido').value||hoje(),dataEntrega:$('f-entrega').value,
    valor,status:$('f-status').value,pagamento,faltante,obs:$('f-obs').value.trim()
  };
  pedidos.unshift(p);
  if(!persistir()){pedidos.shift();return}
  limpar();render();
}
function limpar(){
  ['f-cliente','f-peca','f-pedido','f-entrega','f-valor','f-faltante','f-obs'].forEach(id=>$(id).value='');
  $('f-status').value='pendente';$('f-pagamento').value='nao_pago';$('campo-faltante').style.display='none';
}
function editar(id){
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  $('f-cliente').value=p.cliente;$('f-peca').value=p.peca;$('f-pedido').value=p.dataPedido;
  $('f-entrega').value=p.dataEntrega;$('f-valor').value=p.valor;$('f-status').value=p.status;
  $('f-pagamento').value=p.pagamento||'nao_pago';$('f-faltante').value=p.faltante||'';
  $('campo-faltante').style.display=p.pagamento==='parcial'?'block':'none';$('f-obs').value=p.obs||'';
  pedidos=pedidos.filter(x=>x.id!==id);persistir();render();window.scrollTo({top:0,behavior:'smooth'});
}
$('f-pagamento').onchange=function(){
  $('campo-faltante').style.display=this.value==='parcial'?'block':'none';
  if(this.value==='parcial')$('f-faltante').focus();else $('f-faltante').value='';
};
$('btn-salvar').onclick=salvar;
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('ativo'));c.classList.add('ativo');filtro=c.dataset.filtro;render();
});
$('f-pedido').value=hoje();
carregar();
</script>
</body>
</html>
